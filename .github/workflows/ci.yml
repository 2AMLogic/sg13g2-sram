name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Keep in sync with manifests/README.md and signoff.yml.
  KLT_VERSION: "0.8.0"

jobs:
  layout-tests:
    name: layout generator tests (bitcell)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # klayout pin matches layout/reports/drc-bitcell.json. The macro tests
      # are slow and run in layout-macro-tests.yml.
      - name: Install pytest and klayout
        run: pip install pytest "klayout==0.30.12"

      # The LVS test skips itself when klt is not on PATH; it is not installed here.
      - name: Bitcell generator tests
        working-directory: layout/bitcell
        run: pytest -q test_bitcell.py

  harness-tests:
    name: vendored harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PDK-free harness tests
        run: npm test

      - name: Install pinned klayout-tools
        run: pip install "klayout-tools==${KLT_VERSION}"

      - name: Item 1 attestation has not drifted
        run: klt signoff --attest 1 --inventory attest/item1.json --check attest/item1.envelope.json

      - name: Item 10 attestation has not drifted
        run: klt signoff --attest 10 --inventory attest/item10.json --check attest/item10.envelope.json

      - name: Item 9 attestation has not drifted
        run: klt signoff --attest 9 --inventory attest/item9.json --check attest/item9.envelope.json
