name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  harness-tests:
    name: vendored harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PDK-free harness tests
        run: npm test
