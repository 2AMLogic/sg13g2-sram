name: signoff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with manifests/README.md.
  KLT_VERSION: "0.8.0"

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned klayout-tools
        run: pip install "klayout-tools==${KLT_VERSION}"

      - name: Re-run the grader (exit 0 and 3 are valid grader runs)
        run: |
          rc=0
          klt signoff --manifest manifests/sg13g2-sram.json \
            --tiers-doc manifests/design-evidence-tiers.md --format json \
            > "$RUNNER_TEMP/signoff.json" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff errored (exit $rc)"
            exit 1
          fi

      - name: Committed record is byte-identical to a fresh run
        run: diff -u manifests/sg13g2-sram.signoff.json "$RUNNER_TEMP/signoff.json"
